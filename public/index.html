<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b1220"
  >

  <meta
    name="description"
    content="THE BG Company Management & Digital Workplace System"
  >

  <meta
    name="application-name"
    content="THE BG WEB"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="THE BG WEB"
  >

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">

  <title>THE BG WEB</title>
</head>

<body>

  <!--
    THE BG WEB application root.
    app.js renders the complete application interface here.
  -->
  <div id="app"></div>

  <noscript>
    <div style="
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:system-ui,sans-serif;
      text-align:center;
    ">
      <div>
        <h1>THE BG WEB</h1>
        <p>Please enable JavaScript to use the application.</p>
      </div>
    </div>
  </noscript>

  <script src="/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("/sw.js")
          .catch(function () {});
      });
    }
  </script>

</body>
</html>
